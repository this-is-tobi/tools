name: CD

on:
  push:
    branches:
    - main
  workflow_dispatch:

# Serialized: release-please reconciles the state of every release PR on each
# run, so overlapping runs on a burst of merges fight over the same PRs.
# Queued rather than cancelled - cancelling could drop the build dispatch that
# follows a release tag.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: this-is-tobi/github-workflows/.github/workflows/release-app.yml@dd5a0cfaad806ee7ad9d0888f8ff6c83a5c02404 # v0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      ENABLE_PRERELEASE: false
      TAG_MAJOR_AND_MINOR: false
      AUTOMERGE_RELEASE: false
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  trigger-build:
    name: Trigger image builds
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
    - name: Dispatch build-images.yml
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # release-please-action creates release tags using GITHUB_TOKEN, and tags pushed by
        # GITHUB_TOKEN don't trigger other workflows' `push: tags:` events (GitHub's built-in
        # anti-recursion guard) - so build-images.yml's tag trigger never fires on its own.
        # workflow_dispatch is explicitly exempt from that restriction, so dispatch it here
        # instead. No need to know which package(s) actually released: build-images.yml's own
        # skip-if-already-published guard makes an unconditional "build every active image"
        # dispatch a safe no-op for whichever images didn't just get a new version.
        #
        # Once APP_CLIENT_ID/APP_PRIVATE_KEY are populated on this repository, release-please's
        # tag pushes stop going through GITHUB_TOKEN and start firing build-images.yml's own
        # `push: tags:` trigger too - this dispatch becomes redundant, not wrong. Remove it only
        # after confirming the native trigger actually fires on a release.
        gh workflow run build-images.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }}
