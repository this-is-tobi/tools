name: Refresh images

on:
  schedule:
  # Monthly on the 1st at 00:00 UTC - catches package updates that a pinned
  # base-image bump alone would never trigger: third-party apt repositories
  # (docker.com, nvidia), the tools the dotfiles-based images install at
  # @latest, and the window between upstream rebuilds of a base image where the
  # distro repositories are already ahead of it.
  - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      IMAGES:
        description: Comma separated list of images to refresh (leave empty for all active images)
        required: false
        type: string
      MAX_AGE_DAYS:
        description: Skip images whose published :latest is younger than this many days
        required: false
        type: number
        default: 30
      FORCE:
        description: Refresh every selected image regardless of how recently it was published
        required: false
        type: boolean
        default: false


# Nothing inherits the repository's default token permissions: every job names
# the scopes it uses, so widening the default never silently reaches a job.
permissions: {}

# Serialized: two runs would race to rewrite the same branch and pull request.
# Queued rather than cancelled so a manual refresh started behind the monthly
# one still lands.
concurrency:
  group: refresh-images
  cancel-in-progress: false

jobs:
  refresh:
    name: Touch refresh markers
    # The markers are computed against, and committed on top of, the ref the run
    # starts from. Dispatched from another branch, that branch's unmerged
    # commits would ride along into main.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    # Read-only: the commit, the branch and the pull request are all written
    # with the App token minted below, not with this job's GITHUB_TOKEN.
    permissions:
      contents: read
      # The published-date lookup in "Touch refresh markers"
      packages: read
    env:
      # `secrets` is not available in a step-level `if`, but it is here.
      HAS_APP_AUTH: ${{ secrets.APP_CLIENT_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
      BRANCH: refresh-images
      COMMIT_MESSAGE: "build(docker): scheduled dependency refresh"
    steps:
    # The refresh lands as a pull request built through the API with the App
    # token, and neither half works with GITHUB_TOKEN: a pull request it opens
    # never runs CI, and a commit it pushes is unsigned, which a main ruleset
    # requiring signed commits and passing checks refuses. Fail here rather
    # than half-way through.
    - name: Validate credentials
      run: |
        if [ "$HAS_APP_AUTH" != "true" ]; then
          echo "::error::refresh-images.yml needs the APP_CLIENT_ID and APP_PRIVATE_KEY secrets: the refresh pull request is opened as the GitHub App so that its CI runs and its commit is signed."
          exit 1
        fi

    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Nothing is pushed with git: the commit is created through the API.
        persist-credentials: false

    - name: Touch refresh markers
      id: touch
      env:
        # Passed through the environment rather than interpolated into the
        # script: `${{ }}` is substituted before the shell runs, so a crafted
        # dispatch input would be executed as script rather than read as data.
        IMAGES: ${{ inputs.IMAGES }}
        # `inputs` is empty on a schedule event, so the defaults are restated here
        MAX_AGE_DAYS: ${{ inputs.MAX_AGE_DAYS || 30 }}
        FORCE: ${{ inputs.FORCE || false }}
        GH_TOKEN: ${{ github.token }}
        OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail

        if [ -n "$IMAGES" ]; then
          JQ_FILTER=$(echo "$IMAGES" | jq -R 'split(",")')
          SELECTED=$(jq -c --argjson names "$JQ_FILTER" '[.[] | select(.name | IN($names[])) | select(.deprecated != true)]' ci/matrix.json)
        else
          SELECTED=$(jq -c '[.[] | select(.deprecated != true)]' ci/matrix.json)
        fi

        CUTOFF=$(date -u -d "${MAX_AGE_DAYS} days ago" +%s)
        echo "Refreshing images whose :latest predates $(date -u -d "@${CUTOFF}" +%Y-%m-%dT%H:%M:%SZ)"
        echo

        REFRESHED=0
        SKIPPED=0

        # Written once and read twice: the run summary and the pull request body.
        REPORT="$RUNNER_TEMP/refresh-report.md"
        {
          echo "| Image | Published | Action |"
          echo "| --- | --- | --- |"
        } > "$REPORT"

        while IFS= read -r ROW; do
          NAME=$(echo "$ROW" | jq -r '.name')
          CTX=$(echo "$ROW" | jq -r '.build.context')
          PUBLISHED=""

          if [ "$FORCE" != "true" ]; then
            # Renovate rebuilds an image within hours of its base image moving,
            # and that rebuild reinstalls everything (a changed FROM invalidates
            # every layer). Refreshing an image that was just rebuilt only cuts a
            # release whose contents are identical - which is what filled the
            # changelogs with duplicate-looking entries.
            #
            # Fail open: any lookup that does not produce a usable timestamp
            # falls through to refreshing. An unnecessary rebuild is cheap, an
            # image silently skipped for months is not.
            PUBLISHED=$(gh api "/users/${OWNER}/packages/container/tools%2F${NAME}/versions" \
              --jq 'map(select((.metadata.container.tags // []) | index("latest"))) | first | .created_at' \
              2>/dev/null || true)

            if [ -n "$PUBLISHED" ] && [ "$PUBLISHED" != "null" ]; then
              PUBLISHED_TS=$(date -u -d "$PUBLISHED" +%s 2>/dev/null || true)
              if [ -n "$PUBLISHED_TS" ] && [ "$PUBLISHED_TS" -gt "$CUTOFF" ]; then
                echo "skip     ${NAME} (published ${PUBLISHED})"
                echo "| \`${NAME}\` | ${PUBLISHED} | skipped, rebuilt within ${MAX_AGE_DAYS} days |" >> "$REPORT"
                SKIPPED=$((SKIPPED + 1))
                continue
              fi
            fi
          fi

          echo "refresh  ${NAME}"
          echo "| \`${NAME}\` | ${PUBLISHED:-unknown} | refreshed |" >> "$REPORT"
          date -u +%Y-%m-%dT%H:%M:%SZ > "${CTX}/.refresh"
          REFRESHED=$((REFRESHED + 1))
        done < <(echo "$SELECTED" | jq -c '.[]')

        echo
        echo "${REFRESHED} refreshed, ${SKIPPED} skipped"
        {
          echo
          echo "${REFRESHED} refreshed, ${SKIPPED} skipped (threshold: ${MAX_AGE_DAYS} days)."
        } >> "$REPORT"

        {
          echo "## Scheduled dependency refresh"
          echo
          cat "$REPORT"
        } >> "$GITHUB_STEP_SUMMARY"

        echo "refreshed=${REFRESHED}" >> "$GITHUB_OUTPUT"

    # Scoped to this repository and to what the next step writes: a blob/tree/
    # commit/ref (contents) and the pull request. A mint without the
    # permission-* narrowing inherits every permission the installation holds.
    - name: Generate GitHub App token
      id: app-token
      if: ${{ steps.touch.outputs.refreshed != '0' }}
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ secrets.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write

    # The commit is created through the REST API rather than with git: GitHub
    # signs a commit an App creates that way, as long as no author, committer
    # or signature is supplied, so it satisfies a signed-commits rule on main.
    # The branch is rebuilt from the checked-out main on every run and the pull
    # request reused, so there is only ever one refresh pull request, holding
    # exactly one commit; anything pushed to the branch by hand is discarded.
    - name: Open or update the refresh pull request
      if: ${{ steps.touch.outputs.refreshed != '0' }}
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail

        git add -- 'docker/utils/*/.refresh'
        CHANGED=$(git diff --cached --name-only)
        if [ -z "$CHANGED" ]; then
          echo "No marker changed, nothing to propose"
          exit 0
        fi

        BASE_SHA=$(git rev-parse HEAD)
        BASE_TREE=$(git rev-parse 'HEAD^{tree}')
        TREE=$(jq -n --arg base "$BASE_TREE" '{base_tree: $base, tree: []}')
        while IFS= read -r FILE; do
          TREE=$(jq --arg path "$FILE" --rawfile content "$FILE" \
            '.tree += [{path: $path, mode: "100644", type: "blob", content: $content}]' <<< "$TREE")
        done <<< "$CHANGED"

        TREE_SHA=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq '.sha' <<< "$TREE")
        COMMIT_SHA=$(jq -n --arg message "$COMMIT_MESSAGE" --arg tree "$TREE_SHA" --arg parent "$BASE_SHA" \
            '{message: $message, tree: $tree, parents: [$parent]}' \
          | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq '.sha')
        echo "Created ${COMMIT_SHA} on top of ${BASE_SHA}"

        # Any failure of the lookup lands in the create branch, which then fails
        # on an existing ref rather than silently skipping the update.
        if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --silent 2> /dev/null; then
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
            -f sha="$COMMIT_SHA" -F force=true --silent
        else
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${BRANCH}" -f sha="$COMMIT_SHA" --silent
        fi

        BODY="$RUNNER_TEMP/refresh-body.md"
        {
          echo "Scheduled dependency refresh from \`refresh-images.yml\`. Merging it cuts a patch release for every image marked refreshed below, which rebuilds it with current packages."
          echo
          cat "$RUNNER_TEMP/refresh-report.md"
          echo
          echo "The workflow rebuilds this branch from \`${GITHUB_REF_NAME}\` on every run and updates this pull request, so commits pushed here by hand are discarded. If \`${GITHUB_REF_NAME}\` moves before this merges, re-run the workflow to rebase it."
        } > "$BODY"

        PR_NUMBER=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
          -f head="${GITHUB_REPOSITORY_OWNER}:${BRANCH}" -f base="$GITHUB_REF_NAME" -f state=open \
          --jq '.[0].number // empty')
        if [ -n "$PR_NUMBER" ]; then
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            -f title="$COMMIT_MESSAGE" -F "body=@${BODY}" --silent
          echo "Updated pull request #${PR_NUMBER}"
        else
          PR_URL=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
            -f title="$COMMIT_MESSAGE" -f head="$BRANCH" -f base="$GITHUB_REF_NAME" -F "body=@${BODY}" \
            --jq '.html_url')
          echo "Opened ${PR_URL}"
        fi
