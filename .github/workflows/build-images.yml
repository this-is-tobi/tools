name: Build images

on:
  push:
    tags:
    - '*-v*.*.*'
  workflow_dispatch:
    inputs:
      IMAGES:
        description: Comma separated list of images to build (leave empty to build all active images)
        required: false
        type: string
      FORCE:
        description: Rebuild even if the image:tag already exists in the registry
        required: false
        type: boolean
        default: false

# Nothing inherits the repository's default token permissions: every job names
# the scopes it uses, so widening the default never silently reaches a job.
permissions: {}

# One group per ref. GitHub keeps at most one *pending* run per group and
# cancels it when a newer one queues, even with cancel-in-progress false - a
# burst leaves the first and the last, and cancels everything between.
#
# A tag run builds only the image its tag names, at the tagged commit, so a
# cancelled tag run is a release that never gets an image: with a single group
# for every ref, three release tags pushed together built two images. Each tag
# therefore gets its own group and every release builds, each from exactly the
# commit it was tagged at. (Resolving "everything not yet published" on tag runs
# would also survive the cancellations, but would build one release's image from
# another release's commit, so its provenance would name the wrong source.)
#
# Runs on main - cd.yml's fallback dispatch, manual dispatches - still share one
# group, and dropping the ones between is safe there: they resolve every image
# whose <name>:<version> is not published yet, so the surviving run picks up
# whatever the cancelled ones would have built.
#
# Trade-off: two releases of the same image pushed within one build of each
# other now build side by side, and the floating tags (latest, <major>,
# <major>.<minor>) end on whichever finishes last. If an older one wins, dispatch
# this workflow from the newer release tag with FORCE.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Resolve build matrix
    # A run builds the Dockerfiles and the release-please manifest of the ref it
    # was started on, then publishes and signs the result under the release
    # version. Dispatched from any other branch - a feature branch, or an
    # unmerged release PR's - it would publish unreviewed content as a release,
    # and with FORCE overwrite one that already shipped. Only main and release
    # tags publish; every later job needs this one, so they skip with it.
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # `docker manifest inspect` below, to skip what is already published
      packages: read
    outputs:
      images: ${{ steps.resolve.outputs.IMAGES }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
        logout: true

    - name: Resolve images to build
      id: resolve
      env:
        # Passed through the environment rather than interpolated into the
        # script: `${{ }}` is substituted before the shell runs, so a crafted
        # dispatch input would be executed as script rather than read as data.
        INPUT_IMAGES: ${{ inputs.IMAGES }}
        INPUT_FORCE: ${{ inputs.FORCE }}
      run: |
        if [ "$GITHUB_REF_TYPE" == "tag" ]; then
          IMAGE_NAME="${GITHUB_REF_NAME%-v*}"
          IMAGES=$(jq -c --arg name "$IMAGE_NAME" '[.[] | select(.name == $name)]' ci/matrix.json)
        elif [ -n "$INPUT_IMAGES" ]; then
          # Explicit selection bypasses the deprecated filter (e.g. to patch a legacy image before removal).
          JQ_FILTER=$(echo "$INPUT_IMAGES" | jq -R 'split(",")')
          IMAGES=$(jq -c --argjson names "$JQ_FILTER" '[.[] | select(.name | IN($names[]))]' ci/matrix.json)
        else
          IMAGES=$(jq -c '[.[] | select(.deprecated != true)]' ci/matrix.json)
        fi

        # Resolve each image's version. matrix.json no longer carries a `tag` field for
        # actively-released images (release-please's extra-files JSON updater corrupts a
        # root-array file like matrix.json - see docs/04-docker.md). The release-please
        # manifest is the authoritative current version instead. Deprecated images aren't
        # release-please-managed, so matrix.json's own frozen `tag` is kept for those.
        MANIFEST=$(cat .release-please-manifest.json)
        IMAGES=$(echo "$IMAGES" | jq -c --argjson manifest "$MANIFEST" '
          map(.build.tag = (.build.tag // $manifest["docker/utils/" + .name]))
        ')

        # Skip images whose exact tag is already published (e.g. release-please bootstrap
        # tags matching an already-shipped version). --FORCE bypasses this for manual dispatch.
        if [ "$INPUT_FORCE" != "true" ]; then
          FILTERED="[]"
          # `for row in $(...)` would word-split each JSON object's own spaces (e.g. inside
          # "description") instead of just splitting on jq's newline-per-element output -
          # read it line-by-line instead so each $row stays one intact JSON object.
          while IFS= read -r row; do
            NAME=$(echo "$row" | jq -r '.name')
            TAG=$(echo "$row" | jq -r '.build.tag')
            if docker manifest inspect "ghcr.io/this-is-tobi/tools/${NAME}:${TAG}" > /dev/null 2>&1; then
              echo "Skipping ${NAME}:${TAG} - already published"
            else
              FILTERED=$(echo "$FILTERED" | jq -c --argjson row "$row" '. + [$row]')
            fi
          done < <(echo "$IMAGES" | jq -c '.[]')
          IMAGES="$FILTERED"
        fi

        echo "Resolved images: $IMAGES"
        echo "IMAGES=$IMAGES" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image.name }}
    needs: matrix
    if: ${{ needs.matrix.outputs.images != '[]' }}
    uses: ./.github/workflows/build-and-attest-image.yml
    permissions:
      packages: write
      contents: read
      id-token: write
      attestations: write
    strategy:
      # One image failing to build should not cancel the release of the others
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.images) }}
    secrets:
      # Only used to mint the read-only build token below.
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    with:
      IMAGE_NAME: ghcr.io/this-is-tobi/tools/${{ matrix.image.name }}
      IMAGE_TAG: ${{ matrix.image.build.tag }}
      IMAGE_CONTEXT: ${{ matrix.image.build.context }}
      IMAGE_DOCKERFILE: ${{ matrix.image.build.dockerfile }}
      IMAGE_TARGET: ${{ matrix.image.build.target }}
      # mise resolves its tools through the GitHub API, which is 60
      # requests/hour when unauthenticated and shared across every runner on the
      # same egress IP - building the whole matrix at once exhausts it and the
      # aqua/ubi backends fail with a 403 that mise treats as permanent. So the
      # build gets a token, as the BuildKit secret `github_token` the
      # Dockerfiles mount at /run/secrets/github_token (a secret, not a build
      # arg, so it never lands in an image layer).
      #
      # `app` mints it from the GitHub App narrowed to contents:read on this
      # repository. Never the job token: everything the Dockerfiles execute can
      # read the secret - install scripts, postinstall hooks, prebuilt binaries
      # - and this job holds packages:write, so a compromised upstream could
      # push over the images it is building.
      BUILD_SECRET_GITHUB_TOKEN: app
      LATEST_TAG: ${{ matrix.image.build.latest == true }}
      TAG_MAJOR_AND_MINOR: true
      BUILD_AMD64: true
      BUILD_ARM64: true
      USE_QEMU: false
      # No layer cache: an image is only ever built when its own Dockerfile changed
      # (the skip-if-already-published guard in the matrix job above), and every
      # image copies in a `.refresh` marker before its first RUN. So the layers a
      # build could restore are exactly the ones its trigger invalidated. Exporting
      # them anyway re-uploads every layer a second time - the images are large
      # enough that this tail costs minutes per job for no reuse. Revisit if the
      # Dockerfiles are ever split into finer, independently-changing layers.
      CACHE: false
      PROVENANCE: true
      SBOM: true
      SIGN: true
