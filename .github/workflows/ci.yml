name: CI

on:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review
    branches:
    - main

# Nothing inherits the repository's default token permissions: every job names
# the scopes it uses, so widening the default never silently reaches a job.
permissions: {}

# One CI run per PR - a rapid push sequence otherwise leaves several runs
# racing to push the same <image>:pr-<n> tag. cleanup-pr.yml joins the same
# group, so closing the PR also cancels a run still building.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # One job for every repository linter: a new one (shellcheck over the
  # scripts, hadolint over the Dockerfiles) is one more step here, already
  # covered by CI status. Runs on drafts too: it is cheap, and a broken
  # workflow is better found before the pull request is marked ready.
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Schema, expression and context checks, plus shellcheck over every `run:`
    # block (the image ships shellcheck). Runs from its release image pinned by
    # digest - a tag can be repointed, a digest cannot.
    - name: Run actionlint
      uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      with:
        args: -color

  # Security audit: template injection, persisted credentials, excessive
  # permissions, unpinned references, dangerous triggers. The read-only job
  # token turns on the online audits too (known-vulnerable actions, impostor
  # commits, refs that disagree with their version comment). Accepted findings
  # live in .github/zizmor.yml. Runs on drafts too, like the lint job above.
  scan-zizmor:
    uses: this-is-tobi/github-workflows/.github/workflows/scan-zizmor.yml@cae676d3c0e91fbddfe7f7d25c73868a6da44184 # v0
    permissions:
      contents: read

  lint-commits:
    if: ${{ !github.event.pull_request.draft }}
    uses: this-is-tobi/github-workflows/.github/workflows/lint-commits.yml@cae676d3c0e91fbddfe7f7d25c73868a6da44184 # v0
    permissions:
      contents: read
      pull-requests: read

  resolve-affected:
    name: Resolve affected images and templates
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      images: ${{ steps.resolve.outputs.IMAGES }}
      templates: ${{ steps.resolve.outputs.TEMPLATES }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        # Only the local history is read; nothing here talks to the remote.
        persist-credentials: false

    - name: Resolve affected images and templates
      id: resolve
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)
        echo "Changed files:"
        echo "$CHANGED"

        # An image is affected by its own build context and its own smoke test
        # (ci/tests/<name>.sh), and every image is affected by what they all
        # share: the test libraries (ci/tests/lib*.sh) and the matrix itself.
        # Otherwise a change to a test or to a build entry is merged without the
        # image it describes ever being built or tested against it.
        IMAGES=$(jq -c '[.[] | select(.deprecated != true)]' ci/matrix.json | \
          jq -c --arg files "$CHANGED" '
            ($files | split("\n")) as $changed
            | ($changed | any(. == "ci/matrix.json" or test("^ci/tests/lib[^/]*\\.sh$"))) as $shared
            | [.[]
              | ((.build.context | ltrimstr("./")) + "/") as $ctx
              | ("ci/tests/" + .name + ".sh") as $test
              | select($shared or ($changed | any(startswith($ctx) or . == $test)))]
          ')
        echo "Affected images: $IMAGES"
        echo "IMAGES=$IMAGES" >> "$GITHUB_OUTPUT"

        # Templates aren't tracked in matrix.json (they're never built/published by
        # this pipeline), so their build-check matrix is declared inline. Both a
        # dev and prod target are checked per template since a base-image bump
        # can affect either stage independently.
        TEMPLATES=$(jq -nc '
          [
            {name: "nginx-dev", context: "docker/templates/nginx", dockerfile: "docker/templates/nginx/Dockerfile", target: "dev"},
            {name: "nginx-prod", context: "docker/templates/nginx", dockerfile: "docker/templates/nginx/Dockerfile", target: "prod"},
            {name: "bun-dev", context: "docker/templates/bun", dockerfile: "docker/templates/bun/Dockerfile", target: "dev"},
            {name: "bun-prod", context: "docker/templates/bun", dockerfile: "docker/templates/bun/Dockerfile", target: "prod"}
          ]' | jq -c --arg files "$CHANGED" '
            ($files | split("\n")) as $changed
            | [.[] | select(.context as $ctx | $changed | any(startswith($ctx + "/")))]
          ')
        echo "Affected templates: $TEMPLATES"
        echo "TEMPLATES=$TEMPLATES" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build ${{ matrix.image.name }} (PR check)
    needs: resolve-affected
    if: ${{ needs.resolve-affected.outputs.images != '[]' }}
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@cae676d3c0e91fbddfe7f7d25c73868a6da44184 # v0
    permissions:
      packages: write
      contents: read
    strategy:
      # GHCR intermittently 403s the pull token that `imagetools create` needs to
      # merge the per-arch digests. Left to fail-fast, one such flake cancels
      # every other image mid-build and the whole matrix has to be re-run.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.resolve-affected.outputs.images) }}
    secrets:
      # Only used to mint the read-only token below - see build-images.yml.
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    with:
      IMAGE_NAME: ghcr.io/this-is-tobi/tools/${{ matrix.image.name }}
      IMAGE_TAG: pr-${{ github.event.pull_request.number }}
      IMAGE_CONTEXT: ${{ matrix.image.build.context }}
      IMAGE_DOCKERFILE: ${{ matrix.image.build.dockerfile }}
      IMAGE_TARGET: ${{ matrix.image.build.target }}
      # Raises mise's GitHub API limit during the build - see build-images.yml.
      # Without it a matrix of eight exhausts the 60/hour anonymous limit and the
      # aqua backend 403s, which mise treats as permanent.
      BUILD_SECRET_GITHUB_TOKEN: app
      BUILD_AMD64: true
      BUILD_ARM64: false
      # No layer cache - see build-images.yml. Actions caches are additionally
      # scoped per ref, so nothing a PR build exports is ever visible to main.
      CACHE: false

  build-templates:
    name: Build ${{ matrix.template.name }} (PR check)
    needs: resolve-affected
    if: ${{ needs.resolve-affected.outputs.templates != '[]' }}
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@cae676d3c0e91fbddfe7f7d25c73868a6da44184 # v0
    permissions:
      contents: read
      packages: write
    strategy:
      # See build-images: one leg's failure should not cancel the others
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.resolve-affected.outputs.templates) }}
    with:
      # Templates are never published - PUSH is false, so this is a build check
      # that exports a short-lived tarball artifact instead of pushing. The
      # image name is only used to label that artifact.
      IMAGE_NAME: ghcr.io/this-is-tobi/tools/${{ matrix.template.name }}
      IMAGE_TAG: pr-${{ github.event.pull_request.number }}
      IMAGE_CONTEXT: ${{ matrix.template.context }}
      IMAGE_DOCKERFILE: ${{ matrix.template.dockerfile }}
      IMAGE_TARGET: ${{ matrix.template.target }}
      PUSH: false
      BUILD_AMD64: true
      BUILD_ARM64: false
      # No layer cache - see build-images.yml. Each target gets its own cache
      # scope, so a template's dev and prod stages cannot share entries either.
      CACHE: false

  test-images:
    name: Test ${{ matrix.image.name }} (PR check)
    needs:
    - resolve-affected
    - build-images
    if: ${{ needs.resolve-affected.outputs.images != '[]' }}
    uses: this-is-tobi/github-workflows/.github/workflows/test-docker.yml@cae676d3c0e91fbddfe7f7d25c73868a6da44184 # v0
    permissions:
      contents: read
      packages: read
    strategy:
      # One broken image should not hide the results for the others.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.resolve-affected.outputs.images) }}
    with:
      IMAGE: ghcr.io/this-is-tobi/tools/${{ matrix.image.name }}:pr-${{ github.event.pull_request.number }}
      # Several images declare an entrypoint (a shell, or the backup entrypoint
      # script) that would otherwise swallow the test command.
      ENTRYPOINT: bash
      WORKSPACE_PATH: ci/tests
      WORKSPACE_MOUNT: /tests
      COMMAND: /tests/${{ matrix.image.name }}.sh

  scan-images:
    name: Scan ${{ matrix.image.name }} (PR check)
    needs:
    - resolve-affected
    - build-images
    if: ${{ needs.resolve-affected.outputs.images != '[]' }}
    uses: this-is-tobi/github-workflows/.github/workflows/scan-trivy.yml@cae676d3c0e91fbddfe7f7d25c73868a6da44184 # v0
    permissions:
      contents: read
      packages: read
      security-events: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.resolve-affected.outputs.images) }}
    with:
      IMAGE: ghcr.io/this-is-tobi/tools/${{ matrix.image.name }}:pr-${{ github.event.pull_request.number }}
      FORMAT: table
      # Gating: a CRITICAL vulnerability with a fix available (scan-trivy.yml
      # always passes `ignore-unfixed`), or a CRITICAL secret, fails the pull
      # request. HIGH is left to scan-images.yml, which reports it weekly
      # against what is actually published, so this table carries exactly what
      # blocks.
      #
      # `ignore-unfixed` filters less than it looks on these images: a Go stdlib
      # CVE counts as fixed once Go ships the fix, even inside a third-party
      # prebuilt binary (krew plugins, helm-docs, mkcert, kustomize) that
      # only a new upstream release can change. Such a finding blocks until the
      # tool is updated or removed, or is accepted in .trivyignore.yaml with a
      # reason and a `paths` scope to that binary.
      SEVERITY: CRITICAL
      FAIL_ON_ERROR: true
      TRIVYIGNORES: .trivyignore.yaml
      # Trivy's default is 5m per scan, not per file, and `dev` spends most of it
      # on a single large statically linked binary - at 5m it aborts with a
      # context deadline and writes no report at all, so the image silently goes
      # unscanned while the faster ones report normally.
      TIMEOUT: 15m

  scan-config:
    name: Scan Dockerfiles (PR check)
    if: ${{ !github.event.pull_request.draft }}
    uses: this-is-tobi/github-workflows/.github/workflows/scan-trivy.yml@cae676d3c0e91fbddfe7f7d25c73868a6da44184 # v0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      # Nothing here pulls an image, but an explicit permissions block sets every
      # unlisted scope to none, and GitHub validates against every job the called
      # workflow declares - including its image-scan job, which is skipped at
      # runtime because no IMAGE is passed.
      packages: read
    with:
      PATH: docker
      FORMAT: table
      # Named explicitly because Trivy only auto-detects a plain `.trivyignore`,
      # and the YAML form is the one that supports per-path scoping and a
      # documented reason per entry. Without it this report is ~90 lines of
      # accepted noise, which means nobody reads it and a real finding is missed.
      TRIVYIGNORES: .trivyignore.yaml

  scan-secrets:
    name: Scan for leaked secrets (PR check)
    if: ${{ !github.event.pull_request.draft }}
    uses: this-is-tobi/github-workflows/.github/workflows/scan-gitleaks.yml@cae676d3c0e91fbddfe7f7d25c73868a6da44184 # v0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      # Gating. The first full-history run reported eleven findings, none of them
      # a credential - a public repository URL that gitleaks read as `curl -u`,
      # and the self-describing placeholder key in the node crypto examples. Both
      # are allowlisted by value in .gitleaks.toml, so the scan is clean and a
      # twelfth finding means something.
      FAIL_ON_LEAKS: true

  # The one check for main's branch ruleset to require. The image jobs are
  # matrix legs named after whichever images a pull request touched, so they
  # cannot be listed as required checks themselves, and a job skipped by its
  # `if:` satisfies a required check. This one runs in every CI run and fails
  # unless everything it waits on passed, or had nothing to do. A new pull
  # request job belongs in `needs` below.
  #
  # Nothing may post a skipped CI status for a commit, since that would pass
  # the ruleset: that is why the cleanup on close lives in cleanup-pr.yml, and
  # why this is always(), not !cancelled() - a superseded run still reports
  # failure for its commit.
  ci-status:
    name: CI status
    if: ${{ always() }}
    needs:
    - lint
    - scan-zizmor
    - lint-commits
    - resolve-affected
    - build-images
    - build-templates
    - test-images
    - scan-images
    - scan-config
    - scan-secrets
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
    - name: Check every pull request job
      env:
        DRAFT: ${{ github.event.pull_request.draft }}
        RESULTS: ${{ toJSON(needs) }}
      run: |
        set -euo pipefail

        # The jobs above skip drafts, and skipped would read as passed here.
        if [ "$DRAFT" = "true" ]; then
          echo "::error::Draft pull request: its checks did not run. Mark it ready for review to run them."
          exit 1
        fi

        # These run on every ready pull request, so only success counts. The
        # image and template jobs are skipped when the pull request touches
        # none, which is the one legitimate skip.
        FAILED=$(jq -r '
          ["lint", "scan-zizmor", "lint-commits", "resolve-affected", "scan-config", "scan-secrets"] as $always
          | to_entries[]
          | select(.value.result != "success" and (.value.result != "skipped" or (.key | IN($always[]))))
          | "\(.key): \(.value.result)"
        ' <<< "$RESULTS")

        if [ -n "$FAILED" ]; then
          echo "::error::Some pull request jobs did not pass:"
          echo "$FAILED"
          exit 1
        fi
        echo "Every pull request job passed or had nothing to do."
