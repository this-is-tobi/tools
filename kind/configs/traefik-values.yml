---
providers:
  kubernetesCRD:
    namespaces:
    - default
    - ingress-traefik
  kubernetesIngress:
    namespaces:
    - default
    - ingress-traefik

# Node ports must be in the 30000-32767 range; kind-config.yml maps them to
# host ports 80 and 443.
ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443

service:
  type: NodePort
