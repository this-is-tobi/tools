kind: Secret
apiVersion: v1
metadata:
  name: backup
  namespace: ""
data:
  VAULT_ADDRESS: ""
  VAULT_TOKEN: ""
  VAULT_EXTRA_ARGS: ""
  S3_ENDPOINT: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
  S3_BUCKET_NAME: ""
  S3_BUCKET_PREFIX: ""
  S3_PATH_STYLE: ""
  RETENTION: ""
  RCLONE_EXTRA_ARGS: ""

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: ""
  labels:
    jobgroup: pg-cluster-backup
spec:
  schedule: "0 1 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      name: backup
      labels:
        jobgroup: backup
    spec:
      backoffLimit: 0
      template:
        spec:
          # The image runs as uid 1000 with group 0 and group-writable paths, so
          # it also works unmodified under OpenShift's restricted SCC.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: ghcr.io/this-is-tobi/tools/backup:latest
            command:
            - "/bin/bash"
            - "./scripts/vault-backup.sh"
            imagePullPolicy: Always
            envFrom:
            - secretRef:
                name: backup
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            # Backups stream to object storage rather than staging on disk, so
            # the only writable path needed is a scratch dir. Mount a volume at
            # LOCAL_PATH as well if you back up to a filesystem instead.
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Sized for streaming a dump through rclone. Raise the memory limit
            # if you enable compression or a larger --s3-chunk-size.
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
          volumes:
          - name: tmp
            emptyDir: {}
          restartPolicy: Never
